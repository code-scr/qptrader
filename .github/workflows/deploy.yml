name: Deploy Flask App to EC2

on:

  workflow_dispatch:  # allows manual trigger

  push:
    branches:
      - develop


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up AWS CLI
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }} # e.g., us-east-1

    - name: Deploy to EC2 via SSM
      run: |
        echo "Stopping existing container (if any)..."
        aws ssm send-command \
          --targets "Key=instanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Stop old container" \
          --parameters 'commands=[
            "docker stop qptrader || true",
            "docker rm qptrader || true",
            "docker system prune -f"
          ]'

        echo "Building and running new Docker container..."
        aws ssm send-command \
          --targets "Key=instanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy new container" \
          --parameters 'commands=[
            "cd /home/ubuntu/app",
            "docker build -t qptrader:1.1 .",
            "docker run -d -p 8000:8000 --name qptrader qptrader:1.1"
          ]'
