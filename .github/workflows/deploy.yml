name: Deploy Flask App

on:
  push:
    branches:
      - devlop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker system prune --all --force
          docker build -t qptrader:1.1 .

      - name: Stop and remove existing container
        run: |
          if [ $(docker ps -aq -f name=qptrader) ]; then
            docker stop qptrader
            docker rm qptrader
          fi

      - name: Run Flask container
        run: |
          docker run -d -p 8000:8000 --name qptrader qptrader:1.1
