name: Auto Deploy Flask App to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: nohmad/aws-ssm-send-command-action@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Check if app changed
      id: changes
      run: |
        echo "APP_CHANGED=false" >> $GITHUB_ENV
        if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -qE '^app/|^Dockerfile'; then
          echo "APP_CHANGED=true" >> $GITHUB_ENV
        fi

    - name: Deploy via SSM if app changed
      if: env.APP_CHANGED == 'true'
      uses: nohmad/aws-ssm-send-command-action@v1
      with:
        targets: "Key=InstanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}"
        document-name: "AWS-RunShellScript"
        comment: "Auto deploy Flask Docker container"
        parameters: |
          commands:
            cd /home/ubuntu/qptrader
            docker build -t qptrader:1.1 .
            docker stop qptrader || true
            docker rm qptrader || true
            docker run -d --name qptrader -p 8000:8000 qptrader:1.1
