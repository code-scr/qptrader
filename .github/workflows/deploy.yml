name: Build & Deploy Flask App to EC2 (MySQL on Host)

on:
  push:
    branches:
      - develop

env:
  IMAGE_NAME: qptrader
  IMAGE_TAG: ${{ github.sha }}
  REGION: ${{ secrets.AWS_REGION }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy container via AWS SSM
      uses: nohmad/aws-ssm-send-command-action@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.REGION }}
        targets: '[{"Key":"InstanceIds","Values":["${{ secrets.EC2_INSTANCE_ID }}"]}]'
        document-name: "AWS-RunShellScript"
        parameters: >-
          {
            "commands": [
              "docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}",
              "docker stop qptrader || true",
              "docker rm qptrader || true",
              "docker run -d --name qptrader --restart unless-stopped -p 8000:8000 -e DB_HOST=127.0.0.1 -e DB_USER=${{ secrets.EC2_MYSQL_USER }} -e DB_PASSWORD='${{ secrets.EC2_MYSQL_PASSWORD }}' -e DB_NAME=${{ secrets.EC2_MYSQL_DB }} docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} bash /app/init_db.sh && gunicorn --bind 0.0.0.0:8000 app:app"
            ]
          }

