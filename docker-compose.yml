version: "3.9"

services:
  qptrader:
    image: docker.io/${DOCKERHUB_USERNAME}/qptrader:${IMAGE_TAG}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - qptrader_data:/app/data
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: qptrader_db
      MYSQL_USER: qptrader_user
      MYSQL_PASSWORD: qptrader_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  qptrader_data:
  db_data:
