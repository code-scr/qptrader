version: '3.8'
services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword
      MYSQL_DATABASE: qptrader
    volumes:
      - db_data:/var/lib/mysql

  app:
    image: yourusername/qptrader:latest
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: yourpassword
      DB_NAME: qptrader
    depends_on:
      - db

volumes:
  db_data:
