version: "3.9"

services:
  db:
    image: mysql:8
    container_name: qptr-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: qptraderdb
      MYSQL_USER: qptruser
      MYSQL_PASSWORD: qptrpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qptrader
    restart: always
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: qptraderdb
      MYSQL_USER: qptruser
      MYSQL_PASSWORD: qptrpass
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
