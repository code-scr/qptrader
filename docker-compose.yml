version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: qptrader-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: qptrader
      MYSQL_USER: qptraderuser
      MYSQL_PASSWORD: qptraderpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: qptrader-web
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: qptraderuser
      DB_PASSWORD: qptraderpass
      DB_NAME: qptrader
    ports:
      - "8000:8000"

volumes:
  db_data:
