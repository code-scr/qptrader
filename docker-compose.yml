version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: qptraderdb
      MYSQL_USER: qpuser
      MYSQL_PASSWORD: qppassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: flask_app
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: qptraderdb
      MYSQL_USER: qpuser
      MYSQL_PASSWORD: qppassword

volumes:
  db_data:
