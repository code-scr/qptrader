version: '3.8'

services:
  mydb:
    image: mysql:8
    container_name: mydb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qptrader
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: web
    restart: always
    depends_on:
      - mydb
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_DB: qptrader

volumes:
  db_data:
